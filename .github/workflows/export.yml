name: Export nach Google Sheets

on:
  schedule:
    # 03:00 UTC - im Sommer 05:00, im Winter 04:00 deutscher Zeit.
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Erlaubt den Lauf auch von Hand über den Actions-Reiter.

permissions:
  contents: read

concurrency:
  group: export-sheet
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Export ausführen
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python export_to_sheet.py --schreiben
