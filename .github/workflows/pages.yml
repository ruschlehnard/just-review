name: Dashboard veröffentlichen

# GitHub Pages kann aus dem Branch-Menü nur "/" oder "/docs" ausliefern.
# Dieser Workflow lädt stattdessen den Ordner web/ hoch, sodass die
# Projektstruktur bleiben kann.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # GitHub Pages liefert alles mit cache-control: max-age=600 aus. Der
      # Browser haelt app.js und styles.css also zehn Minuten fest, auch wenn
      # die Seite selbst frisch geladen wird - dann passt die Oberflaeche
      # nicht mehr zum Skript. Der Commit-Kuerzel an der Adresse zwingt ihn,
      # bei jeder Aenderung neu zu holen.
      - name: Dateinamen versionieren
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::7}"
          echo "Version: $V"
          sed -i -E 's/(href|src)="(styles\.css|app\.js|config\.js)"/\1="\2?v='"$V"'"/g' web/index.html
          echo "--- eingebundene Dateien ---"
          grep -oE '(href|src)="[^"]*\?v=[^"]*"' web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
